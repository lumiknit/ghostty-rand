[package]
name = "ghostty-rand"
version = "0.1.3"
edition = "2024"
authors = ["lumiknit<aasr4r4@gmail.com>"]
description = "Open ghostty with random theme and fonts"
readme = "README.md"
repository = "https://github.com/lumiknit/ghostty-rand"
documentation = "https://github.com/lumiknit/ghostty-rand#README.md"
keywords = ["ghostty", "theme"]
categories = ["command-line-utilities"]
license = "MIT OR Apache-2.0"

[dependencies]

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
